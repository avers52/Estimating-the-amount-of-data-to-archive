version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: compression_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - minio_network

  createbuckets:
    image: minio/mc:latest
    container_name: compression_minio_mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing localminio/compression-algorithms-media;
      /usr/bin/mc anonymous set download localminio/compression-algorithms-media;
      /usr/bin/mc anonymous set public localminio/compression-algorithms-media;
      exit 0;
      "
    networks:
      - minio_network

volumes:
  minio_data:

networks:
  minio_network:
    driver: bridge